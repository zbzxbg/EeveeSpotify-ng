name: Build and Release Swift

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "1.0.0"

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

permissions:
  contents: write

jobs:
  build:
    # macOS 26 镜像默认带 Xcode 26.6 / iOS 26.5 SDK。
    # 需要 iOS 26 SDK 的原因：Apple Music 风格歌词层用到的
    # `attributedTextFormattingDefinition(_:)`（注册自定义 TextAttribute 的唯一途径）
    # 是 iOS 26 API，Xcode 16.2 的 iOS 18.2 SDK 里不存在。
    # 注意：只是**编译**需要新 SDK；运行时由 @available(iOS 26.0, *) 兜住，
    # Makefile 的 deployment target 仍为 14.0，老系统照常加载本 tweak。
    runs-on: macos-26

    env:
      THEOS: ${{ github.workspace }}/theos
      PACKAGE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Validate Version
        run: |
          if ! echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $PACKAGE_VERSION"
            exit 1
          fi

      # 从源码编译 SwiftProtobuf，代替 whoeevee 那份预编译 deb。
      # 原因：那份 deb 是 Swift 6.0.3 生成的 .swiftmodule，而 Swift 的二进制模块
      # 格式不跨编译器版本兼容，Xcode 26.6（Swift 6.3.x）无法导入，构建直接失败。
      # whoeevee/swift-protobuf 已归档不再更新，所以改成现场编译。
      # 脚本还带 -emit-module-interface，导出 .swiftinterface 以防将来再撞同样的墙。
      - name: Build SwiftProtobuf from source
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-swiftprotobuf.sh

          # rootful → $THEOS/lib/SwiftProtobuf.framework
          Tools/SwiftProtobufBuild/build-swiftprotobuf.sh

          # rootless → $THEOS/lib/iphone/rootless/SwiftProtobuf.framework
          THEOS_PACKAGE_SCHEME=rootless \
            Tools/SwiftProtobufBuild/build-swiftprotobuf.sh

      - name: Build Rootful Package
        run: |
          make clean package \
            FINALPACKAGE=1 \
            PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Save Rootful Package
        run: |
          ROOTFUL=$(find packages -name '*iphoneos-arm.deb' -type f | head -n 1)

          if [ -z "$ROOTFUL" ]; then
            echo "Rootful package not found"
            exit 1
          fi

          mv "$ROOTFUL" \
            "packages/EeveeSpotify-${PACKAGE_VERSION}-rootful.deb"

      - name: Build Rootless Package
        run: |
          make clean package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Save Rootless Package
        run: |
          ROOTLESS=$(find packages -name '*iphoneos-arm64.deb' -type f | head -n 1)

          if [ -z "$ROOTLESS" ]; then
            echo "Rootless package not found"
            exit 1
          fi

          mv "$ROOTLESS" \
            "packages/EeveeSpotify-${PACKAGE_VERSION}-rootless.deb"

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-${{ inputs.version }}
          path: packages/*.deb
          if-no-files-found: error

      # 主要修改了这一步：去掉了 --generate-notes，加上了 --draft
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            packages/*.deb \
            --title "EeveeSpotify ${PACKAGE_VERSION}" \
            --draft