name: Build Swift Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos

          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Copy SwiftProtobuf (rootless)
        run: |
          mkdir -p swiftprotobuf-rootless && cd swiftprotobuf-rootless
          wget https://github.com/whoeevee/swift-protobuf/releases/download/1.29.0/org.swift.protobuf.swiftprotobuf_1.29.0_iphoneos-arm64.deb
          ar -x org.swift.protobuf.swiftprotobuf_1.29.0_iphoneos-arm64.deb
          tar -xvf data.tar.lzma
          mkdir -p $THEOS/lib/iphone/rootless
          cp -r var/jb/Library/Frameworks/SwiftProtobuf.framework $THEOS/lib/iphone/rootless/

      - name: Build rootless .deb
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: rootless-deb
          path: packages/*.deb
          if-no-files-found: error