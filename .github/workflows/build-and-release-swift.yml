name: Build and Release Swift

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "1.0.0"

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos
      PACKAGE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2.0"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Validate Version
        run: |
          if ! echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install SwiftProtobuf (Rootful)
        run: |
          mkdir -p swiftprotobuf
          cd swiftprotobuf

          wget "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb"

          ar -x "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb"
          tar -xvf data.tar.lzma

          cp -r Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib"

      - name: Install SwiftProtobuf (Rootless)
        run: |
          mkdir -p swiftprotobuf-rootless
          cd swiftprotobuf-rootless

          wget "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb"

          ar -x "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb"
          tar -xvf data.tar.lzma

          mkdir -p "$THEOS/lib/iphone/rootless"
          cp -r var/jb/Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib/iphone/rootless"

      - name: Build Rootful Package
        run: |
          make clean package \
            FINALPACKAGE=1 \
            PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Save Rootful Package
        run: |
          ROOTFUL=$(find packages -name '*iphoneos-arm.deb' -type f | head -n 1)

          if [ -z "$ROOTFUL" ]; then
            echo "Rootful package not found"
            exit 1
          fi

          mv "$ROOTFUL" \
            "packages/EeveeSpotify-${PACKAGE_VERSION}-rootful.deb"

      - name: Build Rootless Package
        run: |
          make clean package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Save Rootless Package
        run: |
          ROOTLESS=$(find packages -name '*iphoneos-arm64.deb' -type f | head -n 1)

          if [ -z "$ROOTLESS" ]; then
            echo "Rootless package not found"
            exit 1
          fi

          mv "$ROOTLESS" \
            "packages/EeveeSpotify-${PACKAGE_VERSION}-rootless.deb"

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-${{ inputs.version }}
          path: packages/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            packages/*.deb \
            --title "EeveeSpotify ${PACKAGE_VERSION}" \
            --generate-notes